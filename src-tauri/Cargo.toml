[package]
name = "haven-build"
version = "0.4.0"
description = "Personal character build guide companion"
authors = ["you"]
edition = "2021"

[lib]
name = "haven_build_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.4"
